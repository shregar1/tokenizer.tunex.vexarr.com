[package]
name = "tunex-tokenizer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shregar1/tokenizer.tunex.vexarr.com"
description = "High-performance Rust tokenizer engine for TuneX with batch tokenization, SIMD-aware preprocessing, zero-copy text handling, and Hugging Face tokenizer compatibility"
readme = "README.md"
keywords = ["llm", "tokenizer", "rust", "training", "ai"]
categories = ["science", "development-tools"]

[dependencies]
async-trait = "0.1.89"
bytes = "1.11.1"
metrics = "0.24.6"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
smallvec = "1.15.1"
thiserror = "2.0.18"
tokenizers = "0.23.1"
tracing = "0.1.44"
tunex-core = { version = "0.1.0", path = "../core.tunex.vexarr.com" }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "hf_single"
harness = false

[[bench]]
name = "hf_batch"
harness = false

[[bench]]
name = "parallel_batch"
harness = false

[[bench]]
name = "template_format"
harness = false

[[bench]]
name = "cache_lookup"
harness = false

[[bench]]
name = "stream_adapter"
harness = false

[[bench]]
name = "end_to_end"
harness = false
